<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poem Select</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Language as Commodity</h1>
            <p>An exploration of value, access, and the commodification of expression</p>
        </div>
        
        <div class="main-content">
            <div class="text-area">
                <div class="poem-select-grid">
                    <div class="poem-card" onclick="addParam('p', 'cost-of-expression')">
                        <div class="poem-card-contents">
                            The Cost of Expression
                        </div>
                    </div>
                    <div class="poem-card">
                        <div class="poem-card-contents">
                            Ich bin
                        </div>
                    </div>
                    <div class="poem-card">
                        poem 3
                    </div>
                    <div class="poem-card">
                        poem 4
                    </div>
                </div>
            
            
        </div>
    </div>
    <script>
        function addParam(key, value) {
            const url = new URL(window.location.href);
            url.searchParams.set(key, value);
            window.history.pushState({}, "", url);
        }
    </script>
</body>
</html>
