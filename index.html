            </div>
            <div class="poem-card" onclick="addParam('p', 'ich-bin')">

                </div>
            </div>
            <div class="poem-card" onclick="addParam('p', 'the-weather-clock-points-south')">
                <div class="poem-card-contents">
                    <p class="poem-card-title">The Weather-Clock Points South</p>
                    <p class="poem-card-author">Amy Lowell</p>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            
            <div class="text-area">
                <h1 id="title"></h1>
                <div id="poem" class="poem-text"></div>
            </div>

            <div class="sidebar">
                <div class="stats">
                    <h4>Access Status</h4>
                    <div class="stat-item"><span>Words unlocked</span><span class="stat-value" id="unlockedCount"></span></div>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                </div>

                <div class="package" id="package">
                    <div class="package-header">
                    <div class="package-name">Full poem</div>
                    <div class="package-price" id="price"></div>
                    </div>
                    <div class="package-description">Unlock every hidden word in this poem.</div>
                    <button class="buy-button" id="buyButton">Purchase</button>
                </div>
            </div>

        </div>
    </div>


    <script>
        function addParam(key, value) {
            const url = new URL(window.location.href);
            url.searchParams.set(key, value);
            window.location.href = url.toString();
        }


    </script>
    <script type="module">
        import { loadPoem, renderPoem, lockableWords, countWords, countUnlocked } from './js/render.js';
        import { has, grant } from './js/store.js';
        window.grant = grant;



        // render poems
        const slug = new URLSearchParams(location.search).get('p') ?? 'cost-of-expression';
        const poem = await loadPoem(slug);
        document.getElementById('title').textContent = poem.title;

        // check if payment was made
        const params = new URLSearchParams(location.search);
        if (params.get('paid') === '1') {
            grant(slug);
            history.replaceState({}, '', `?p=${slug}`);   // clean the URL
        }

        renderPoem(poem, document.getElementById('poem'), () => has(slug));


        function updatePanel(poem, slug) {
            const unlocked = has(slug);
            const total = countWords(poem);
            const open = unlocked ? total : 0;

            document.getElementById('unlockedCount').textContent = `${open} of ${total}`;
            document.getElementById('progressFill').style.width = `${(open / total) * 100}%`;
            document.getElementById('price').textContent = `$${poem.price.toFixed(2)}`;

        }

        updatePanel(poem, slug);
        const button = document.getElementById('buyButton');
        button.addEventListener('click', () => {
            button.disabled = true;
            button.textContent = 'Redirecting…';
            window.location.assign(poem.stripeLink);
        });
    </script>
